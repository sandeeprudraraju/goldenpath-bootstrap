# ArgoCD managing its own installation (self-management).
# Once bootstrap/root-app.yaml is applied, this Application takes over the
# ArgoCD Helm release that bootstrap/argocd-install.yaml originally created.
#
# All future ArgoCD config/version changes happen via a Git commit to
# values.yaml in this folder — never kubectl/helm directly against argocd
# resources again.

apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: https://argoproj.github.io/argo-helm
      chart: argo-cd
      targetRevision: 7.7.11   # check latest: helm search repo argo/argo-cd --versions
      helm:
        valueFiles:
          - $values/goldenpaths/apps/argocd/values.yaml
    - repoURL: https://github.com/sandeeprudraraju/goldenpath-bootstrap.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
